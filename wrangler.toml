name = "anthonybecker-me"
compatibility_date = "2026-07-24"
main = "src/index.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
# Without a prefix listed here, that path never reaches src/index.js at
# all — the platform serves it from static assets first, and since there's
# no file at that path it 404s before the Worker's fetch() ever runs. The
# battler-cards routes are deliberately outside /studio-.../ (they're the
# one part of this system meant to be reachable with no password), so they
# need their own entry or every card-battler demo silently falls back to
# its fixed placeholder deck with no error anywhere.
run_worker_first = ["/studio-c33f3ea406426b41*", "/private/c33f3ea406426b41/*", "/api/battler-cards*"]

# Trading-card design system storage (see private/c33f3ea406426b41/cards/).
[[d1_databases]]
binding = "CARD_DB"
database_name = "anthonybecker-cards"
database_id = "3a91dc29-87b6-4d32-8226-c77b1c290722"
migrations_dir = "d1/migrations"

# R2 bucket "anthonybecker-cards" still needs to be created — R2 must be
# enabled for this account via the dashboard once (Cloudflare requires
# opting in there, it can't be done through the API) before
# `wrangler r2 bucket create anthonybecker-cards` or a deploy will work.
[[r2_buckets]]
binding = "CARD_BUCKET"
bucket_name = "anthonybecker-cards"
