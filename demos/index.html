<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demos — Anthony Becker</title>
  <meta name="description" content="Demos by Anthony Becker">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <nav class="crumbs"><a href="/">← home</a></nav>
    <h1>Demos</h1>
    <ul class="demo-list" id="demo-list">
      <li class="empty">Loading…</li>
    </ul>
  </main>

  <script>
    fetch('/demos/manifest.json')
      .then((res) => res.json())
      .then((demos) => {
        const list = document.getElementById('demo-list');
        if (!demos.length) {
          list.innerHTML = '<li class="empty">No demos yet.</li>';
          return;
        }
        list.innerHTML = demos
          .map((demo) => `
            <li>
              <a href="${demo.path}"><span class="demo-number">#${demo.number}</span>${demo.title}</a>
              ${demo.description ? `<p>${demo.description}</p>` : ''}
            </li>
          `)
          .join('');
      })
      .catch(() => {
        document.getElementById('demo-list').innerHTML = '<li class="error">Couldn\'t load demos.</li>';
      });
  </script>
</body>
</html>
