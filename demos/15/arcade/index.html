<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Arcade: Cathode-Ray Tube Amusement Device (1947) — Anthony Becker</title>
<meta name="description" content="A WebGPU arcade room with one cabinet. On its tube runs the 1947 Cathode-Ray Tube Amusement Device: turn two knobs, lob a beam at paper aeroplanes.">
<meta name="theme-color" content="#07050b">
<link rel="canonical" href="https://anthonybecker.me/demos/15/arcade/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Anthony Becker">
<meta property="og:title" content="Arcade">
<meta property="og:description" content="The 1947 Cathode-Ray Tube Amusement Device, playable on a cabinet in a WebGPU room.">
<meta property="og:url" content="https://anthonybecker.me/demos/15/arcade/">
<meta property="og:image" content="https://anthonybecker.me/demos/15/arcade/card.jpg">
<meta property="og:image:width" content="1200">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Limelight&display=swap">
<style>
:root{--bg:#07050b;--ink:#f3e6c8;--dim:#9c8f78;--amber:#ffb347;--green:#6dffa0;--red:#e2331c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.root{height:100dvh;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;pointer-events:none}
.title{display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px #000}
.title b{font-family:Limelight,Georgia,serif;font-weight:400;font-size:clamp(15px,4.2vw,22px);color:var(--amber);letter-spacing:.02em;line-height:1.15}
.title span{font-size:11px;color:var(--dim);letter-spacing:.08em}.title a{color:var(--dim);pointer-events:auto}
.chip{pointer-events:auto;flex:none;font:inherit;font-size:12px;color:var(--ink);background:rgba(20,14,26,.75);border:1px solid #4a3b2a;border-radius:999px;padding:9px 14px;min-height:40px;cursor:pointer}
.chip:focus-visible,.fire:focus-visible,.knob:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.score{position:absolute;left:14px;bottom:10px;display:flex;gap:14px;font-size:11px;letter-spacing:.1em;color:var(--dim);text-shadow:0 1px 4px #000;pointer-events:none}
.score b{color:var(--green);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hint{position:absolute;right:14px;bottom:34px;font-size:10px;color:#6f6558;letter-spacing:.06em;pointer-events:none}
.over{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(10,6,14,.85);border:1px solid var(--amber);color:var(--amber);padding:10px 16px;border-radius:6px;font-size:14px;white-space:nowrap}
.note{position:absolute;left:14px;right:14px;top:70px;font-size:12px;color:var(--dim);background:rgba(10,6,14,.8);padding:8px 10px;border-radius:6px}
.panel{flex:none;display:flex;justify-content:center;align-items:center;gap:clamp(14px,7vw,56px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#17121c,#0c090f);border-top:1px solid #3a2d20}
.knob{width:96px;text-align:center;touch-action:none;cursor:ew-resize;border-radius:10px}
.knob svg{width:84px;height:84px;display:block;margin:0 auto}
.tick{stroke:#6f6558;stroke-width:2;stroke-linecap:round}
.cap{fill:#3b2f22;stroke:#a88752;stroke-width:2}
.cap2{fill:#1c1611;stroke:#5d4a31;stroke-width:1}
.ptr{fill:var(--amber)}
.klabel{font-size:10px;letter-spacing:.14em;color:var(--dim);margin-top:2px}
.kval{font-size:14px;color:var(--green);font-variant-numeric:tabular-nums}
.fire{flex:none;width:86px;height:86px;border-radius:50%;border:3px solid #5a140c;background:radial-gradient(circle at 35% 30%,#ff6a50,var(--red) 55%,#8c1a0c);color:#fff4e8;font:inherit;font-weight:600;font-size:15px;letter-spacing:.12em;white-space:pre-line;line-height:1.15;cursor:pointer;box-shadow:0 5px 0 #4a0f08,0 8px 18px rgba(0,0,0,.6);touch-action:manipulation}
.fire:active{transform:translateY(4px);box-shadow:0 1px 0 #4a0f08,0 3px 8px rgba(0,0,0,.6)}
.fire.again{font-size:12px;background:radial-gradient(circle at 35% 30%,#ffd27a,#e08a1c 55%,#8c4b0c);border-color:#5a3a0c;color:#1a0d05}
@media (max-height:520px){.knob svg{width:60px;height:60px}.fire{width:64px;height:64px}.panel{padding-top:6px}}
</style></head>
<body><div id="app"></div><script src="app.js"></script></body></html>
