<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a1530; color: #d9d3ee; }
  body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  nav { font-size: 0.9rem; margin-bottom: 0.6rem; }
  a { color: #f2eeff; }
  nav a { text-decoration: none; border-bottom: 1px solid currentColor; }
  h1 { font: 800 1.5rem/1.2 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: 0.02em; color: #fff3d6; margin: 0 0 0.6rem; }
  #stage { position: relative; width: 100%; aspect-ratio: 1; background: #1a1530; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; border-radius: 14px; overflow: hidden; transition: background 0.6s; }
  #view { display: block; width: 100%; height: 100%; }
  #top { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; align-items: center; color: #fff3d6; text-shadow: 0 1px 3px #000a; pointer-events: none; }
  #lvl { font: 800 17px/1 Georgia, "Times New Roman", serif; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
  #lvl .dot { opacity: 0.6; }
  #lvl .lo { font-size: 15px; }
  #icons { display: inline-flex; gap: 4px; }
  #icons svg { width: 18px; height: 18px; }
  #right { display: flex; align-items: center; gap: 6px; font: 800 15px/1 ui-rounded, system-ui, sans-serif; }
  #right svg { width: 14px; height: 14px; }
  #star { color: #ffd84a; }
  #floors { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column-reverse; gap: 8px; }
  #floors button { width: 26px; height: 18px; padding: 0; border-radius: 6px; background: #ffffff22; border: 2px solid #ffffff55; }
  #floors button[aria-pressed="true"] { background: #ffd84a; border-color: #ffd84a; }
  #pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; font: 900 26px/1 ui-rounded, system-ui, sans-serif; letter-spacing: 0.02em; -webkit-text-stroke: 1.5px #1a1530; paint-order: stroke fill; white-space: nowrap; }
  #act { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font: 700 120px/1 Georgia, "Times New Roman", serif; color: #fff3d6; text-shadow: 0 6px 30px #000c; opacity: 0; }
  #card { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: #fff3d6; color: #2a1d55; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px #0008; animation: rise 0.35s cubic-bezier(.2,1.6,.4,1); }
  #card[hidden], #menu[hidden] { display: none; }
  #card > svg { width: 30px; height: 30px; }
  @keyframes rise { from { transform: translate(-50%, 40px); opacity: 0; } }
  button { font: 700 14px/1 ui-rounded, system-ui, sans-serif; border: 0; border-radius: 10px; padding: 10px 14px; background: #3b2a6b; color: #fff3d6; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.go { background: #ff4f7e; color: #fff; }
  button:active { transform: translateY(1px); }
  button svg { width: 18px; height: 18px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; justify-content: center; }
  .bar button { padding: 11px 15px; }
  #menu { position: absolute; inset: 0; background: #1a1530f2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; }
  #menu .head { display: flex; align-items: center; gap: 22px; }
  #menu .big { font: 700 64px/1 Georgia, "Times New Roman", serif; color: #fff3d6; min-width: 120px; text-align: center; }
  #menu .row { display: flex; gap: 8px; }
  #menu .row button { width: 56px; height: 46px; justify-content: center; font: 700 17px/1 Georgia, "Times New Roman", serif; }
  #menu .row button.done { background: #4fd6a4; color: #1a1530; }
  #menu .row button.cur { outline: 3px solid #ffd84a; }
  #menu .row button.locked { opacity: 0.45; }
  #menu .flip { background: transparent; padding: 8px; }
  #menu .flip:disabled { opacity: 0.2; }
  #coach { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: #fff3d6; color: #2a1d55; border-radius: 12px; padding: 9px 14px; font: 700 15px/1.35 ui-rounded, system-ui, sans-serif; text-align: center; box-shadow: 0 8px 24px #0007; pointer-events: none; animation: rise 0.3s cubic-bezier(.2,1.6,.4,1); }
  #coach[hidden] { display: none; }
  #icons { pointer-events: auto; cursor: pointer; }
</style>
</head>
<body>
<main>
  <nav><a href="/demos/">← Demos</a></nav>
  <h1>4x4x4</h1>
  <div id="stage">
    <canvas id="view" aria-label="A tower of 4x4 floors with chess pieces on them"></canvas>
    <div id="top"><span id="lvl"></span><span id="right"><span id="star" hidden><svg viewBox="0 0 16 16" fill="currentColor"><path d="m8 1 2.1 4.4 4.9.6-3.6 3.4.9 4.8L8 11.9 3.7 14.2l.9-4.8L1 6l4.9-.6z"/></svg></span><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="4" r="2.6"/><path d="M5 15c0-4 1-6 3-6s3 2 3 6z"/></svg><span id="left"></span></span></div>
    <div id="floors"></div>
    <div id="pops"></div>
    <div id="act"></div>
    <div id="coach" hidden></div>
    <div id="card" hidden></div>
    <div id="menu" hidden></div>
  </div>
  <div class="bar">
    <button id="prev" aria-label="Previous puzzle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
    <button id="undo" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3 2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
    <button id="reset" aria-label="Retry"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M12 1.5V5H8.5"/></svg></button>
    <button id="hint" aria-label="Hint"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 11.5h5M6.5 14h3"/><path d="M8 1.5a4.5 4.5 0 0 0-2.5 8.2v1.8h5V9.7A4.5 4.5 0 0 0 8 1.5z"/></svg></button>
    <button id="levels" aria-label="All puzzles"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg></button>
    <button id="sound" aria-label="Sound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.5L8 3v10l-3.5-3H2z" fill="currentColor"/><path class="waves" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9"/><path class="mute" d="m10.5 6 4 4m0-4-4 4"/></svg></button>
    <button id="next" aria-label="Next puzzle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
  </div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
