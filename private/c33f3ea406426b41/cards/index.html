<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Card Studio</title>
<style>
  @font-face { font-family: "Display"; src: url("fonts/Display-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Display"; src: url("fonts/Display-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Body"; src: url("fonts/Body-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Body"; src: url("fonts/Body-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Body"; src: url("fonts/Body-Italic.ttf"); font-style: italic; }

  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: .75rem 1rem;
    border-bottom: 1px solid #2a2a2a;
  }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  .tab {
    background: none;
    border: 1px solid #3a3a3a;
    color: #bbb;
    padding: .4rem .9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
  }
  .tab.active { background: #4a7dff; border-color: #4a7dff; color: #fff; }

  main { display: none; }
  main.active { display: flex; }

  #cards-view { height: calc(100vh - 53px); }
  #sidebar {
    width: 220px;
    border-right: 1px solid #2a2a2a;
    overflow-y: auto;
    padding: .5rem;
  }
  #sidebar button.new {
    width: 100%;
    padding: .5rem;
    margin-bottom: .5rem;
    border-radius: 6px;
    border: 1px dashed #3a3a3a;
    background: none;
    color: #bbb;
    cursor: pointer;
  }
  #sidebar button.toggle-archived {
    width: 100%;
    padding: .35rem;
    margin-bottom: .5rem;
    border-radius: 6px;
    border: 1px solid #3a3a3a;
    background: none;
    color: #999;
    font-size: .75rem;
    cursor: pointer;
  }
  .card-row {
    padding: .5rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
  }
  .card-row:hover { background: #1c1c1c; }
  .card-row.selected { background: #24314f; }
  .card-row .t { color: #eee; }
  .card-row .d { color: #777; font-size: .75rem; }
  .card-row .meta { display: flex; gap: .3rem; flex-wrap: wrap; margin: .25rem 0; }
  .rarity-chip {
    font-size: .68rem;
    padding: .05rem .35rem;
    border-radius: 4px;
    text-transform: capitalize;
    background: #333;
    color: #bbb;
  }
  .rarity-chip.rarity-uncommon { background: #1f4a42; color: #7cd9c4; }
  .rarity-chip.rarity-rare { background: #1c3a5c; color: #8ec4f5; }
  .rarity-chip.rarity-legendary { background: #5c4a1c; color: #f5d98e; }
  .power-chip { font-size: .68rem; padding: .05rem .35rem; border-radius: 4px; background: #222; color: #999; }

  #editor {
    flex: 1;
    display: flex;
    overflow-y: auto;
  }
  #form-panel { width: 380px; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
  #preview-panel { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; }
  #preview-panel canvas { border: 1px solid #333; max-width: 100%; height: auto; }

  .panel { background: #1c1c1c; border-radius: 8px; padding: .85rem; display: flex; flex-direction: column; gap: .5rem; }
  .panel h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #999; margin: 0; }
  .badge { font-size: .7rem; padding: .1rem .4rem; border-radius: 4px; background: #333; text-transform: none; letter-spacing: normal; color: #bbb; }
  .badge.ready { background: #1f5c3a; color: #7cf5a0; }
  label { font-size: .8rem; color: #bbb; }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: .45rem .6rem;
    border-radius: 6px;
    border: 1px solid #3a3a3a;
    background: #0d0d0d;
    color: #eee;
    font-size: .85rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 3.5rem; }
  .row { display: flex; gap: .5rem; align-items: center; }
  .row > * { flex: 1; }
  button {
    padding: .5rem .7rem;
    border-radius: 6px;
    border: none;
    background: #4a7dff;
    color: white;
    font-size: .85rem;
    cursor: pointer;
  }
  button:disabled { background: #333; color: #777; cursor: default; }
  button.secondary { background: #333; }
  button.small { padding: .3rem .5rem; font-size: .75rem; }
  .status { font-size: .78rem; min-height: 1.2em; }
  .status.error { color: #ff6b6b; }
  .status.busy { color: #999; }
  .status.ok { color: #7cf5a0; }

  .stat-row { display: flex; gap: .4rem; }
  .stat-row input { flex: 1; }

  #gems-view { height: calc(100vh - 53px); padding: 1rem; gap: 1rem; overflow-y: auto; }
  #gem-list { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
  .gem-row {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .4rem .6rem;
    background: #1c1c1c;
    border-radius: 6px;
    font-size: .82rem;
    cursor: pointer;
  }
  .gem-row .badge { font-size: .7rem; padding: .1rem .4rem; border-radius: 4px; background: #333; }
  .gem-row .badge.approved { background: #1f5c3a; color: #7cf5a0; }
  .gem-detail { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
  .gem-detail img, .gem-detail canvas { width: 140px; height: 140px; background: #222; border-radius: 6px; }
  .slider-row { display: flex; align-items: center; gap: .5rem; font-size: .78rem; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row output { width: 3rem; text-align: right; color: #bbb; }

  #prompts-view { height: calc(100vh - 53px); }
  #prompts-main { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
  #skills-panel { width: 320px; border-left: 1px solid #2a2a2a; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
  .generator-tab { background: none; border: 1px solid #3a3a3a; color: #bbb; padding: .35rem .7rem; border-radius: 6px; cursor: pointer; font-size: .8rem; }
  .generator-tab.active { background: #4a7dff; border-color: #4a7dff; color: #fff; }
  .prompt-textarea { min-height: 220px; font-family: ui-monospace, monospace; font-size: .82rem; }
  .resolved-preview {
    white-space: pre-wrap;
    background: #0d0d0d;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: .6rem;
    font-size: .8rem;
    color: #bbb;
    max-height: 200px;
    overflow-y: auto;
    margin: 0;
    font-family: ui-monospace, monospace;
  }
  .prompt-history-row { padding: .35rem .5rem; border-radius: 6px; cursor: pointer; font-size: .78rem; color: #999; }
  .prompt-history-row:hover { background: #1c1c1c; }
  .prompt-history-row.current { color: #7cf5a0; }
  .skill-row { padding: .35rem .5rem; border-radius: 6px; cursor: pointer; font-size: .82rem; font-family: ui-monospace, monospace; }
  .skill-row:hover { background: #1c1c1c; }
  .skill-row.selected { background: #24314f; }

  /* Attached by attachSlashAutocomplete() in app.js — the textarea is moved
     into this wrapper at runtime so the dropdown can anchor right below it
     regardless of what else shares the surrounding .panel. */
  .textarea-wrap { position: relative; }
  .slash-autocomplete {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #1c1c1c;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    max-height: 160px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
  }
  .slash-item { padding: .4rem .6rem; font-size: .82rem; font-family: ui-monospace, monospace; cursor: pointer; }
  .slash-item:hover { background: #24314f; }

  @media (max-width: 720px) {
    header { padding: .6rem .75rem; gap: .5rem; }
    header h1 { font-size: 1rem; }
    .tab { padding: .4rem .7rem; }

    #cards-view, #gems-view, #prompts-view {
      height: auto;
      min-height: calc(100vh - 53px);
      overflow-y: visible;
      flex-direction: column;
    }

    #sidebar {
      width: 100%;
      max-height: 35vh;
      border-right: none;
      border-bottom: 1px solid #2a2a2a;
    }

    #editor { flex-direction: column; overflow-y: visible; }
    #form-panel { width: 100%; overflow-y: visible; }
    #preview-panel { padding: .75rem; }

    .gem-detail img, .gem-detail canvas { width: 100px; height: 100px; }

    #skills-panel { width: 100%; border-left: none; border-top: 1px solid #2a2a2a; }
  }
</style>
</head>
<body>
<header>
  <h1>Card Studio</h1>
  <button class="tab active" data-view="cards">Cards</button>
  <button class="tab" data-view="gems">Gems</button>
  <button class="tab" data-view="prompts">Prompts</button>
</header>

<main id="cards-view" class="active">
  <div id="sidebar">
    <button class="new" id="new-card-btn" disabled>+ New Card</button>
    <button class="toggle-archived" id="toggle-archived-btn">Show archived</button>
    <div id="card-list"></div>
  </div>
  <div id="editor" style="display:none">
    <div id="form-panel">
      <div class="panel">
        <label>Title</label>
        <input type="text" id="title-input">
      </div>

      <div class="panel">
        <h2>Portrait</h2>
        <textarea id="portrait-instruction" placeholder="Describe the portrait, or an edit instruction..."></textarea>
        <div class="row">
          <select id="portrait-resolution">
            <option value="1K">1K (iterate)</option>
            <option value="2K">2K (final)</option>
          </select>
          <button id="generate-portrait-btn">Generate</button>
        </div>
        <div class="status" id="portrait-status"></div>
      </div>

      <div class="panel">
        <h2>Flavor text</h2>
        <textarea id="flavor-guidance" placeholder="Optional guidance/tone for the generated flavor text..."></textarea>
        <div class="row">
          <input type="number" id="flavor-max-chars" value="200" min="10">
          <button id="generate-flavor-btn">Generate</button>
        </div>
        <textarea id="flavor-text" placeholder="Flavor text (editable by hand)..."></textarea>
        <div class="status" id="flavor-status"></div>
      </div>

      <div class="panel">
        <h2>Gem</h2>
        <select id="gem-select"><option value="">(none)</option></select>
      </div>

      <div class="panel">
        <h2>Stats</h2>
        <div id="stats-list"></div>
        <button class="secondary small" id="add-stat-btn">+ Add Stat</button>
      </div>

      <div class="panel">
        <h2>Battler <span class="badge" id="battle-ready-badge">unpublished</span></h2>
        <label>Power</label>
        <input type="number" id="power-input" min="1" step="1" placeholder="e.g. 7">
        <label>Rarity</label>
        <select id="rarity-select">
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="legendary">Legendary</option>
        </select>
        <button class="secondary" id="publish-card-btn">Publish to Battler</button>
        <div class="status" id="publish-status"></div>
      </div>

      <div class="panel">
        <h2>Card lifecycle <span class="badge" id="archived-badge" style="display:none">archived</span></h2>
        <button class="secondary" id="archive-card-btn">Archive</button>
        <div class="status" id="archive-status"></div>
      </div>

      <button id="save-card-btn">Save Card</button>
      <div class="status" id="save-status"></div>
    </div>
    <div id="preview-panel">
      <canvas id="preview-canvas" width="750" height="1050"></canvas>
    </div>
  </div>
</main>

<main id="gems-view">
  <div class="panel">
    <h2>New gem candidate</h2>
    <label>Name</label>
    <input type="text" id="gem-name-input">
    <label>Declared palette (comma-separated hex, e.g. #8a2d1c, #f4b93f)</label>
    <input type="text" id="gem-palette-input">
    <label>Visual description</label>
    <textarea id="gem-instruction-input" placeholder="a faceted ember-orange crystal, glowing from within"></textarea>
    <button id="generate-gem-btn">Generate Candidate</button>
    <div class="status" id="gem-create-status"></div>
  </div>

  <div class="panel">
    <h2>Pool</h2>
    <div id="gem-list"></div>
  </div>

  <div class="panel" id="gem-detail-panel" style="display:none">
    <h2>Tune mask</h2>
    <div class="gem-detail">
      <div>
        <label>Raw art</label><br>
        <img id="gem-raw-preview" alt="raw gem art">
      </div>
      <div>
        <label>Masked preview</label><br>
        <canvas id="gem-masked-preview" width="140" height="140"></canvas>
      </div>
      <div style="flex:1; min-width:200px; display:flex; flex-direction:column; gap:.5rem;">
        <div class="slider-row">
          <label>Threshold</label>
          <input type="range" id="mask-threshold" min="0" max="150" step="1">
          <output id="mask-threshold-val"></output>
        </div>
        <div class="slider-row">
          <label>Edge softness</label>
          <input type="range" id="mask-edge" min="1" max="100" step="1">
          <output id="mask-edge-val"></output>
        </div>
        <div class="slider-row">
          <label>Despill</label>
          <input type="range" id="mask-despill" min="0" max="1" step="0.05">
          <output id="mask-despill-val"></output>
        </div>
        <div class="row">
          <button class="secondary" id="save-mask-btn">Save Mask Params</button>
          <button id="approve-gem-btn">Approve</button>
        </div>
        <div class="status" id="gem-detail-status"></div>
      </div>
    </div>
  </div>
</main>

<main id="prompts-view">
  <div id="prompts-main">
    <div class="row" id="generator-tabs">
      <button class="generator-tab active" data-generator="portrait">Portrait</button>
      <button class="generator-tab" data-generator="flavor">Flavor</button>
      <button class="generator-tab" data-generator="gem">Gem</button>
      <button class="generator-tab" data-generator="gem_field_fill">Gem Field-Fill</button>
    </div>

    <div class="panel">
      <h2>System prompt <span class="badge" id="prompt-version-badge">v1</span></h2>
      <textarea
        id="prompt-text"
        class="prompt-textarea"
        placeholder="System prompt text. Type /name to include a skill — it resolves fresh every time this generator runs."
      ></textarea>
      <div class="row">
        <button class="secondary" id="preview-prompt-btn">Preview Resolved</button>
        <button id="save-prompt-btn" disabled>Save New Version</button>
      </div>
      <div class="status" id="prompt-save-status"></div>
      <div>
        <label>Resolved preview</label>
        <pre class="resolved-preview" id="prompt-preview"></pre>
      </div>
    </div>

    <div class="panel">
      <h2>Version history</h2>
      <div id="prompt-history-list"></div>
    </div>
  </div>

  <div id="skills-panel">
    <div class="panel">
      <h2>Skills</h2>
      <div id="skill-list"></div>
      <button class="secondary small" id="new-skill-btn">+ New Skill</button>
    </div>
    <div class="panel">
      <h2>Edit skill</h2>
      <label>Name (used as /name)</label>
      <input type="text" id="skill-name-input" placeholder="e.g. no-text">
      <label>Text</label>
      <textarea id="skill-text-input" placeholder="Text inserted wherever /name is used..."></textarea>
      <div class="row">
        <button class="secondary" id="delete-skill-btn" style="display:none">Delete</button>
        <button id="save-skill-btn">Save Skill</button>
      </div>
      <div class="status" id="skill-status"></div>
    </div>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
