<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Card Studio</title>
<style>
  @font-face { font-family: "Display"; src: url("fonts/Display-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Display"; src: url("fonts/Display-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Body"; src: url("fonts/Body-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Body"; src: url("fonts/Body-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Body"; src: url("fonts/Body-Italic.ttf"); font-style: italic; }

  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: .75rem 1rem;
    border-bottom: 1px solid #2a2a2a;
  }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  .tab {
    background: none;
    border: 1px solid #3a3a3a;
    color: #bbb;
    padding: .4rem .9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
  }
  .tab.active { background: #4a7dff; border-color: #4a7dff; color: #fff; }

  main { display: none; }
  main.active { display: flex; }

  #cards-view { height: calc(100vh - 53px); }
  #sidebar {
    width: 220px;
    border-right: 1px solid #2a2a2a;
    overflow-y: auto;
    padding: .5rem;
  }
  #sidebar button.new {
    width: 100%;
    padding: .5rem;
    margin-bottom: .5rem;
    border-radius: 6px;
    border: 1px dashed #3a3a3a;
    background: none;
    color: #bbb;
    cursor: pointer;
  }
  .card-row {
    padding: .5rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
  }
  .card-row:hover { background: #1c1c1c; }
  .card-row.selected { background: #24314f; }
  .card-row .t { color: #eee; }
  .card-row .d { color: #777; font-size: .75rem; }

  #editor {
    flex: 1;
    display: flex;
    overflow-y: auto;
  }
  #form-panel { width: 380px; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
  #preview-panel { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; }
  #preview-panel canvas { border: 1px solid #333; max-width: 100%; height: auto; }

  .panel { background: #1c1c1c; border-radius: 8px; padding: .85rem; display: flex; flex-direction: column; gap: .5rem; }
  .panel h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #999; margin: 0; }
  label { font-size: .8rem; color: #bbb; }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: .45rem .6rem;
    border-radius: 6px;
    border: 1px solid #3a3a3a;
    background: #0d0d0d;
    color: #eee;
    font-size: .85rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 3.5rem; }
  .row { display: flex; gap: .5rem; align-items: center; }
  .row > * { flex: 1; }
  button {
    padding: .5rem .7rem;
    border-radius: 6px;
    border: none;
    background: #4a7dff;
    color: white;
    font-size: .85rem;
    cursor: pointer;
  }
  button:disabled { background: #333; color: #777; cursor: default; }
  button.secondary { background: #333; }
  button.small { padding: .3rem .5rem; font-size: .75rem; }
  .status { font-size: .78rem; min-height: 1.2em; }
  .status.error { color: #ff6b6b; }
  .status.busy { color: #999; }
  .status.ok { color: #7cf5a0; }

  .stat-row { display: flex; gap: .4rem; }
  .stat-row input { flex: 1; }

  #gems-view { height: calc(100vh - 53px); padding: 1rem; gap: 1rem; overflow-y: auto; }
  #gem-list { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
  .gem-row {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .4rem .6rem;
    background: #1c1c1c;
    border-radius: 6px;
    font-size: .82rem;
    cursor: pointer;
  }
  .gem-row .badge { font-size: .7rem; padding: .1rem .4rem; border-radius: 4px; background: #333; }
  .gem-row .badge.approved { background: #1f5c3a; color: #7cf5a0; }
  .gem-detail { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
  .gem-detail img, .gem-detail canvas { width: 140px; height: 140px; background: #222; border-radius: 6px; }
  .slider-row { display: flex; align-items: center; gap: .5rem; font-size: .78rem; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row output { width: 3rem; text-align: right; color: #bbb; }
</style>
</head>
<body>
<header>
  <h1>Card Studio</h1>
  <button class="tab active" data-view="cards">Cards</button>
  <button class="tab" data-view="gems">Gems</button>
</header>

<main id="cards-view" class="active">
  <div id="sidebar">
    <button class="new" id="new-card-btn" disabled>+ New Card</button>
    <div id="card-list"></div>
  </div>
  <div id="editor" style="display:none">
    <div id="form-panel">
      <div class="panel">
        <label>Title</label>
        <input type="text" id="title-input">
      </div>

      <div class="panel">
        <h2>Portrait</h2>
        <textarea id="portrait-instruction" placeholder="Describe the portrait, or an edit instruction..."></textarea>
        <div class="row">
          <select id="portrait-resolution">
            <option value="1K">1K (iterate)</option>
            <option value="2K">2K (final)</option>
          </select>
          <button id="generate-portrait-btn">Generate</button>
        </div>
        <div class="status" id="portrait-status"></div>
      </div>

      <div class="panel">
        <h2>Flavor text</h2>
        <textarea id="flavor-guidance" placeholder="Optional guidance/tone for the generated flavor text..."></textarea>
        <div class="row">
          <input type="number" id="flavor-max-chars" value="200" min="10">
          <button id="generate-flavor-btn">Generate</button>
        </div>
        <textarea id="flavor-text" placeholder="Flavor text (editable by hand)..."></textarea>
        <div class="status" id="flavor-status"></div>
      </div>

      <div class="panel">
        <h2>Gem</h2>
        <select id="gem-select"><option value="">(none)</option></select>
      </div>

      <div class="panel">
        <h2>Stats</h2>
        <div id="stats-list"></div>
        <button class="secondary small" id="add-stat-btn">+ Add Stat</button>
      </div>

      <button id="save-card-btn">Save Card</button>
      <div class="status" id="save-status"></div>
    </div>
    <div id="preview-panel">
      <canvas id="preview-canvas" width="750" height="1050"></canvas>
    </div>
  </div>
</main>

<main id="gems-view">
  <div class="panel">
    <h2>New gem candidate</h2>
    <label>Name</label>
    <input type="text" id="gem-name-input">
    <label>Declared palette (comma-separated hex, e.g. #8a2d1c, #f4b93f)</label>
    <input type="text" id="gem-palette-input">
    <label>Visual description</label>
    <textarea id="gem-instruction-input" placeholder="a faceted ember-orange crystal, glowing from within"></textarea>
    <button id="generate-gem-btn">Generate Candidate</button>
    <div class="status" id="gem-create-status"></div>
  </div>

  <div class="panel">
    <h2>Pool</h2>
    <div id="gem-list"></div>
  </div>

  <div class="panel" id="gem-detail-panel" style="display:none">
    <h2>Tune mask</h2>
    <div class="gem-detail">
      <div>
        <label>Raw art</label><br>
        <img id="gem-raw-preview" alt="raw gem art">
      </div>
      <div>
        <label>Masked preview</label><br>
        <canvas id="gem-masked-preview" width="140" height="140"></canvas>
      </div>
      <div style="flex:1; min-width:200px; display:flex; flex-direction:column; gap:.5rem;">
        <div class="slider-row">
          <label>Threshold</label>
          <input type="range" id="mask-threshold" min="0" max="150" step="1">
          <output id="mask-threshold-val"></output>
        </div>
        <div class="slider-row">
          <label>Edge softness</label>
          <input type="range" id="mask-edge" min="1" max="100" step="1">
          <output id="mask-edge-val"></output>
        </div>
        <div class="slider-row">
          <label>Despill</label>
          <input type="range" id="mask-despill" min="0" max="1" step="0.05">
          <output id="mask-despill-val"></output>
        </div>
        <div class="row">
          <button class="secondary" id="save-mask-btn">Save Mask Params</button>
          <button id="approve-gem-btn">Approve</button>
        </div>
        <div class="status" id="gem-detail-status"></div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
