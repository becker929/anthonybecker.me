<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Image Studio</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem 4rem;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.3rem; margin-bottom: .25rem; }
  p.sub { color: #999; margin-top: 0; font-size: .9rem; }
  .panel {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  label { font-size: .85rem; color: #bbb; }
  textarea {
    width: 100%;
    min-height: 5rem;
    padding: .6rem .7rem;
    border-radius: 6px;
    border: 1px solid #3a3a3a;
    background: #0d0d0d;
    color: #eee;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
  }
  .images-row { display: flex; gap: .75rem; }
  .image-slot {
    flex: 1;
    border: 1px dashed #3a3a3a;
    border-radius: 8px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #0d0d0d;
  }
  .image-slot img { width: 100%; height: 100%; object-fit: cover; }
  .image-slot .hint { color: #666; font-size: .8rem; text-align: center; padding: .5rem; }
  .image-slot input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .image-slot .clear {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0,0,0,.6); color: #eee; border: none;
    border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-size: .8rem;
    display: none;
  }
  .image-slot.filled .clear { display: block; }
  button.generate {
    padding: .7rem;
    border-radius: 6px;
    border: none;
    background: #4a7dff;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button.generate:disabled { background: #333; color: #777; cursor: default; }
  button.generate:not(:disabled):hover { background: #3d6be0; }
  .status { font-size: .85rem; min-height: 1.2em; }
  .status.error { color: #ff6b6b; }
  .status.busy { color: #999; }
  .result { margin-top: 1rem; text-align: center; }
  .result img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .result p { color: #777; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Image Studio</h1>
  <p class="sub">Up to two reference images, plus a prompt, generated with Gemini.</p>
  <div class="panel">
    <div>
      <label>Reference images (optional, up to 2)</label>
      <div class="images-row">
        <div class="image-slot" id="slot-0">
          <span class="hint">Click to add image 1</span>
          <input type="file" accept="image/*" id="file-0">
          <button type="button" class="clear" data-slot="0">&times;</button>
        </div>
        <div class="image-slot" id="slot-1">
          <span class="hint">Click to add image 2</span>
          <input type="file" accept="image/*" id="file-1">
          <button type="button" class="clear" data-slot="1">&times;</button>
        </div>
      </div>
    </div>
    <div>
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="Describe the image you want..."></textarea>
    </div>
    <button class="generate" id="generate-btn">Generate</button>
    <div class="status" id="status"></div>
  </div>
  <div class="result" id="result"></div>
</main>
<script src="app.js"></script>
</body>
</html>
