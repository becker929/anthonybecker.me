<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>skrng — Anthony Becker</title>
  <meta name="description" content="Work-in-progress renders, streamed as they come off the rig.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="skrng.css">
</head>
<body>
  <main>
    <nav class="crumbs"><a href="/">← home</a></nav>
    <h1>skrng</h1>
    <p class="lede">Renders off the rig, rough and unmastered. One batch per page, newest first.</p>
    <section class="batch-head" id="batch-head" hidden>
      <h2 id="batch-title"></h2>
      <p class="batch-notes" id="batch-notes"></p>
      <button type="button" class="review" id="review" hidden>Review by voice</button>
      <p class="review-alt"><a href="#" id="rv-from-start" hidden>Review from track 1</a></p>
      <section class="rv" id="rv" hidden aria-label="Voice review">
        <p class="rv-state" id="rv-state" aria-live="polite"></p>
        <p class="rv-heard" id="rv-heard" aria-live="polite"></p>
        <div class="rv-buttons">
          <button type="button" id="rv-done" class="rv-done" disabled>Done</button>
          <button type="button" id="rv-again" disabled>Again</button>
          <button type="button" id="rv-stop">Stop</button>
        </div>
        <label class="rv-type">Or type a note for this track
          <input id="rv-typed" type="text" autocomplete="off" enterkeyhint="done">
        </label>
        <p class="rv-help">Say <b>next</b> to finish an answer, <b>again</b> to replay, <b>go back</b> for the previous track, <b>stop</b> to end. An earbud click skips to the question, or ends your answer.</p>
      </section>
      <p class="rv-key" id="rv-key"></p>
      <button type="button" class="play-batch" id="play-batch">Play batch</button>
      <p class="now" id="now" aria-live="polite"></p>
    </section>
    <ul class="renders" id="renders">
      <li class="empty">Loading…</li>
    </ul>
    <nav class="batch-nav" id="batch-nav"></nav>
    <audio id="seq" preload="none"></audio>
    <audio id="rv-audio" preload="none"></audio>
  </main>
  <div class="transport" role="region" aria-label="Player">
    <button type="button" id="t-prev" aria-label="Previous track (plays its announcement)"></button>
    <button type="button" id="t-play" class="t-play" aria-label="Play"></button>
    <button type="button" id="t-next" aria-label="Next track (plays its announcement)"></button>
    <div class="t-info">
      <span id="t-title" class="t-title">Nothing playing</span>
      <span id="t-time" class="t-time"></span>
    </div>
  </div>

  <script>
    // Renders come from manifest.json; batch titles from batches.json.
    // One batch per page (?batch=N, default newest). Older batches are
    // reached only through the link at the bottom of the page.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    function facts(r) {
      const out = [];
      if (r.duration_s != null) out.push(`${Math.floor(r.duration_s / 60)}:${String(Math.round(r.duration_s % 60)).padStart(2, '0')}`);
      if (r.bpm != null) out.push(`${r.bpm} BPM`);
      if (r.lufs != null) out.push(`${r.lufs} LUFS`);
      if (r.true_peak_dbtp != null) out.push(`${r.true_peak_dbtp} dBTP`);
      return out.join(' · ');
    }

    // Optional "refs": [{title, url}] — what a render was shaped after.
    // Only https links are made clickable.
    function refs(r) {
      if (!Array.isArray(r.refs) || !r.refs.length) return '';
      const items = r.refs.map((x) => (/^https:\/\//.test(x.url || '')
        ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>`
        : esc(x.title)));
      return `<p class="refs">Shaped after: ${items.join(' · ')}</p>`;
    }

    const batchOf = (r) => (Number.isFinite(r.batch) ? r.batch : 1); // batches may be decimal, e.g. 4.1

    Promise.all([
      fetch('/skrng/manifest.json').then((res) => res.json()),
      fetch('/skrng/batches.json').then((res) => (res.ok ? res.json() : [])).catch(() => []),
    ])
      .then(([renders, batches]) => {
        const list = document.getElementById('renders');
        if (!renders.length) {
          list.innerHTML = '<li class="empty">Nothing yet.</li>';
          return;
        }
        const nums = [...new Set(renders.map(batchOf))].sort((a, b) => a - b);
        const newest = nums[nums.length - 1];
        const asked = parseFloat(new URLSearchParams(location.search).get('batch'));
        const n = nums.includes(asked) ? asked : newest;
        const meta = batches.find((b) => b.n === n) || {};
        const items = renders.filter((r) => batchOf(r) === n);
        if (!meta.ordered) items.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

        document.getElementById('batch-head').hidden = false;
        document.getElementById('batch-title').textContent = meta.title || `Batch ${n}`;
        document.getElementById('batch-notes').textContent = meta.notes || '';

        list.innerHTML = items
          .map((r, i) => `
            <li id="${esc(r.id)}" data-i="${i}">
              <div class="head">
                <a class="title" href="?batch=${n}#${esc(r.id)}">${i + 1}. ${esc(r.title)}</a>
                <time datetime="${esc(r.date)}">${esc(r.date)}</time>
              </div>
              <audio controls preload="none" src="${esc(r.file)}"></audio>
              <p class="facts">${esc(facts(r))} · <a href="${esc(r.file)}" download>mp3</a></p>
              ${r.notes ? `<p class="notes">${esc(r.notes)}</p>` : ''}
              ${refs(r)}
            </li>
          `)
          .join('');

        // Bottom navigation is the only way to older (and back to newer) batches.
        const idx = nums.indexOf(n);
        const nav = [];
        if (idx > 0) nav.push(`<a href="?batch=${nums[idx - 1]}">← Older: batch ${nums[idx - 1]}</a>`);
        if (idx < nums.length - 1) nav.push(`<a href="?batch=${nums[idx + 1]}">Newer: batch ${nums[idx + 1]} →</a>`);
        document.getElementById('batch-nav').innerHTML = nav.join('');

        // Playback controller shared by the Play batch button, each track's
        // own player and the sticky transport at the bottom of the page.
        //
        // A "run" plays, for each track from a start point: the announcement
        // (500 ms silence, spoken title, 500 ms silence, baked into the file)
        // on the hidden player, then the track on its own visible player so
        // that player shows it playing. Skip back/forward start a run at the
        // previous/next track, so the announcement plays first.
        // Mobile browsers only let an element start playing on its own after
        // it has played once from a tap, so the first tap that starts a run
        // unlocks every player (muted play, then pause).
        const seq = document.getElementById('seq');
        const players = [...list.querySelectorAll('audio')];
        const queue = [];
        items.forEach((r, i) => {
          if (r.announce) queue.push({ i, kind: 'announce', src: r.announce });
          queue.push({ i, kind: 'track' });
        });
        const btn = document.getElementById('play-batch');
        const now = document.getElementById('now');
        const tPrev = document.getElementById('t-prev');
        const tPlay = document.getElementById('t-play');
        const tNext = document.getElementById('t-next');
        const tTitle = document.getElementById('t-title');
        const tTime = document.getElementById('t-time');
        // Control icons are inline SVG (currentColor), never emoji glyphs.
        const svg = (d) => `<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" focusable="false"><path fill="currentColor" d="${d}"/></svg>`;
        const ICON = {
          play: svg('M7 4.5v15l12.5-7.5z'),
          pause: svg('M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z'),
          stop: svg('M6 6h12v12H6z'),
          prev: svg('M5 5h2.5v14H5zM19 5v14L8.5 12z'),
          next: svg('M16.5 5H19v14h-2.5zM5 5v14l10.5-7z'),
        };
        let running = false; // a run is in progress (possibly paused)
        let pos = 0;         // index into queue while running
        let cur = -1;        // track the transport follows
        let driving = false; // the controller itself is starting/stopping media
        let unlocked = false;

        const fmt = (t) => (Number.isFinite(t) ? `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}` : '–:––');
        function quiet(fn) { driving = true; try { fn(); } finally { setTimeout(() => { driving = false; }, 0); } }
        function mark(i) {
          list.querySelectorAll('li').forEach((li) => li.classList.toggle('current', Number(li.dataset.i) === i));
        }
        function active() {
          if (running && queue[pos] && queue[pos].kind === 'announce') return seq;
          return cur >= 0 ? players[cur] : null;
        }
        function render() {
          const m = active();
          const isAnnounce = m === seq;
          const isPlaying = !!m && !m.paused;
          tPlay.innerHTML = isPlaying ? ICON.pause : ICON.play;
          tPlay.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
          tPrev.disabled = cur < 0; // on track 1, skip back replays it (announcement first)
          tNext.disabled = cur >= items.length - 1;
          if (cur < 0) {
            tTitle.textContent = 'Nothing playing';
            tTime.textContent = '';
          } else {
            tTitle.textContent = `${isAnnounce ? 'Next: ' : ''}${cur + 1}. ${items[cur].title.replace(/^HW002 — /, '')}`;
            tTime.textContent = isAnnounce ? '' : `${fmt(players[cur].currentTime)} / ${fmt(players[cur].duration || items[cur].duration_s)}`;
          }
          btn.innerHTML = running ? `${ICON.stop}<span>Stop</span>` : `${ICON.play}<span>Play batch</span>`;
          btn.classList.toggle('on', running);
          mark(cur);
        }
        function unlock() {
          if (unlocked) return;
          unlocked = true;
          driving = true;
          players.forEach((p) => {
            p.muted = true;
            p.play().then(() => { p.pause(); p.currentTime = 0; p.muted = false; }).catch(() => { p.muted = false; });
          });
          // The unlock plays settle asynchronously; ignore their events.
          setTimeout(() => { driving = false; }, 400);
        }
        function step() {
          if (!running) return;
          if (pos >= queue.length) { stopRun(); now.textContent = 'Batch finished.'; return render(); }
          const q = queue[pos];
          cur = q.i;
          const li = list.querySelector(`li[data-i="${q.i}"]`);
          if (q.kind === 'announce') {
            now.textContent = `Next: ${q.i + 1}. ${items[q.i].title}`;
            li?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            quiet(() => players.forEach((o) => o.pause()));
            seq.src = q.src;
            seq.play().catch(() => advance());
          } else {
            now.textContent = `Playing: ${q.i + 1}. ${items[q.i].title}`;
            const p = players[q.i];
            quiet(() => {
              players.forEach((o) => { if (o !== p) o.pause(); });
              p.currentTime = 0;
              p.play().catch(() => advance());
            });
          }
          render();
        }
        function advance() { pos += 1; step(); }
        function runFrom(i) {
          unlock();
          quiet(() => { seq.pause(); players.forEach((o) => o.pause()); });
          running = true;
          pos = queue.findIndex((q) => q.i === i);
          step();
        }
        function stopRun() {
          running = false;
          quiet(() => {
            seq.pause();
            const q = queue[pos];
            if (q && q.kind === 'track') players[q.i].pause();
          });
          render();
        }

        seq.addEventListener('ended', advance);
        seq.addEventListener('error', () => { if (running) advance(); });
        ['play', 'pause', 'timeupdate'].forEach((ev) => seq.addEventListener(ev, render));
        players.forEach((p, i) => {
          ['pause', 'timeupdate', 'loadedmetadata'].forEach((ev) => p.addEventListener(ev, () => { if (i === cur) render(); }));
          p.addEventListener('play', () => {
            if (driving) return render();
            // Playing a track by hand: one track at a time, and the transport follows it.
            quiet(() => { seq.pause(); players.forEach((o) => { if (o !== p) o.pause(); }); });
            const q = queue[pos];
            if (running && !(q && q.kind === 'track' && q.i === i)) { running = false; now.textContent = ''; }
            cur = i;
            render();
          });
          p.addEventListener('ended', () => {
            const q = queue[pos];
            if (running && q && q.kind === 'track' && q.i === i) advance();
            else render();
          });
          // Pausing the playing track on its own player ends the run;
          // the transport's pause keeps it (see tPlay).
          p.addEventListener('pause', () => {
            const q = queue[pos];
            if (running && !driving && !p.ended && q && q.kind === 'track' && q.i === i) { stopRun(); now.textContent = ''; }
          });
        });

        btn.addEventListener('click', () => {
          if (running) { stopRun(); now.textContent = ''; return; }
          runFrom(0);
        });
        tPlay.addEventListener('click', () => {
          const m = active();
          if (!m) return runFrom(0);
          if (m.paused) {
            quiet(() => m.play().catch(() => {}));
          } else {
            quiet(() => m.pause());
          }
          render();
        });
        tPrev.innerHTML = ICON.prev;
        tNext.innerHTML = ICON.next;
        tPrev.addEventListener('click', () => runFrom(Math.max(0, cur - 1)));
        tNext.addEventListener('click', () => { if (cur < items.length - 1) runFrom(cur + 1); });
        render();

        // Hand the batch to the voice review (review.js).
        window.skrngPage = { n, meta, items, list, players, stopRun: () => { if (running) { stopRun(); now.textContent = ''; } } };
        window.dispatchEvent(new CustomEvent('skrng:ready', { detail: window.skrngPage }));

        // A #id link scrolls to that render once the list exists.
        if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
      })
      .catch(() => {
        document.getElementById('renders').innerHTML = '<li class="error">Couldn\'t load renders.</li>';
      });
  </script>
  <script type="module" src="review.js"></script>
</body>
</html>
