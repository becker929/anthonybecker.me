<title>Onset Rhythm Machine — Anthony Becker</title>
<meta name="description" content="A rhythm machine for walking through every 16th-note pattern, one sound at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: one phone-width column of cards; the rhythm and transport sit first, settings below */
  --bg: #e8ecef;
  --panel: #f8fafb;
  --ink: #17202a;
  --muted: #566371;
  --line: #c9d2da;
  --accent: #0f6c8c;
  --on-accent: #ffffff;
  --head: #c77700;
  --heart: #d02c66;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
:focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding: 14px 16px 90px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
.where { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.lab, label:not(.check) { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.help { margin: 0; color: var(--muted); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; }

.id { font: 500 22px/1.25 var(--mono); text-align: left; background: none; border: 0; padding: 0; color: var(--ink); overflow-wrap: anywhere; }
.meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tag { border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; font-size: 12px; }
.loops { margin-left: auto; }

.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
@media (min-width: 520px) { .grid { grid-template-columns: repeat(16, 1fr); } }
.cell { height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); padding: 0; position: relative; }
.cell.beat { border-left: 3px solid var(--muted); }
.cell.on { background: var(--accent); border-color: var(--accent); }
.cell.on.beat { border-left-color: var(--ink); }
.cell.now { box-shadow: 0 0 0 2px var(--head); }
.cell i { position: absolute; top: 1px; right: 4px; font: 500 10px var(--mono); color: var(--muted); }
.cell.on i { color: var(--on-accent); }

.btn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 500; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.sq { width: 44px; padding: 0; font-size: 20px; flex: none; }
.transport { display: grid; grid-template-columns: 1fr 1.3fr 1fr 60px; gap: 8px; }
.btn.play { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px; min-height: 52px; }
.btn.play.on { background: var(--head); border-color: var(--head); color: #1b1300; }
.transport .btn { min-height: 52px; }

select, input[type='text'] { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; width: 100%; font-size: 16px; }
input[type='text'] { font-family: var(--mono); min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip { min-height: 40px; min-width: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-variant-numeric: tabular-nums; }
.chip.sel { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

.stepper { display: flex; flex-direction: column; gap: 6px; }
.srow { display: flex; align-items: center; gap: 8px; }
.srow input[type='range'] { flex: 1; min-width: 0; height: 44px; accent-color: var(--accent); }
.srow output { width: 3.2ch; text-align: right; font: 500 18px var(--mono); }

.check { display: flex; align-items: center; gap: 10px; min-height: 40px; text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 400; color: var(--ink); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.loadrow { display: flex; gap: 8px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row3 .btn { padding: 0 6px; font-size: 14px; }

.history { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.hrow { width: 100%; display: grid; grid-template-columns: 3.5ch 1fr auto; gap: 10px; align-items: baseline; text-align: left; min-height: 40px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: var(--bg); }
.hrow.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.hn { color: var(--muted); font: 12px var(--mono); text-align: right; }
.hid { font: 14px var(--mono); overflow-wrap: anywhere; }
.hsrc { color: var(--muted); font-size: 12px; }

.toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 0.15s, transform 0.15s; }
.toast.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* emphasis: a bar under each emphasized step, faint where the step is empty */
.cell.em::after { content: ''; position: absolute; left: 4px; right: 4px; bottom: 3px; height: 4px; border-radius: 2px; background: var(--head); opacity: 0.4; }
.cell.em.on::after { opacity: 1; }
.hasem .cell.on:not(.em) { opacity: 0.72; }

.btn.heart { padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; gap: 3px; color: var(--muted); font-size: 20px; }
.btn.heart.has { color: var(--heart); border-color: var(--heart); }
.btn.heart small { font: 500 12px var(--mono); color: var(--ink); }
.btn.heart:active { transform: scale(0.92); }
.unheart { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
.hsrc { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 8px; text-align: right; }
.hh { color: var(--heart); font: 500 12px var(--mono); white-space: nowrap; }
.particle { position: fixed; z-index: 10; pointer-events: none; color: var(--heart); font-size: 20px; line-height: 1; transform: translate(-50%, -50%) scale(0.3); opacity: 0; animation: fly 0.95s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
@keyframes fly {
  0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(var(--sc)); opacity: 0; }
}

/* chord and pairing machines */
.id.small { font-size: 16px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot { min-height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; overflow-wrap: anywhere; }
.slot b { font-size: 16px; font-weight: 600; line-height: 1.15; }
.slot small { font-size: 12px; color: var(--muted); line-height: 1.15; }
.slot.sel { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.slot.now { box-shadow: 0 0 0 2px var(--head); }
.six { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.six .chip { padding: 0 2px; min-width: 0; }
.cell.iv { height: 40px; font: 500 13px var(--font); color: var(--ink); }
.cell.iv.on { color: var(--on-accent); }
.cell.iv:disabled { opacity: 1; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.setlist { display: flex; flex-direction: column; gap: 6px; max-height: 232px; overflow-y: auto; }
.chip.set { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; min-height: 44px; padding: 6px 12px; overflow-wrap: anywhere; flex: none; }
.chip.set span:last-child { white-space: nowrap; }
.mono { font-family: var(--mono); }
div.cell { cursor: default; }
