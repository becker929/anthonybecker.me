<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anthony Becker</title>
  <meta name="description" content="Anthony Becker">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Anthony Becker</h1>
    <p>This site is under construction.</p>

    <h2>Demos</h2>
    <ul class="demo-list" id="demo-list">
      <li class="empty">Loading…</li>
    </ul>

    <h2>Research</h2>
    <ul class="demo-list" id="research-list">
      <li class="empty">Loading…</li>
    </ul>
  </main>

  <script>
    fetch('/demos/manifest.json')
      .then((res) => res.json())
      .then((demos) => {
        const list = document.getElementById('demo-list');
        if (!demos.length) {
          list.innerHTML = '<li class="empty">No demos yet.</li>';
          return;
        }
        list.innerHTML = demos
          .map((demo) => `
            <li>
              <a href="${demo.path}"><span class="demo-number">#${demo.number}</span>${demo.title}</a>
              ${demo.description ? `<p>${demo.description}</p>` : ''}
            </li>
          `)
          .join('');
      })
      .catch(() => {
        document.getElementById('demo-list').innerHTML = '<li class="error">Couldn\'t load demos.</li>';
      });

    fetch('/research/manifest.json')
      .then((res) => res.json())
      .then((items) => {
        const list = document.getElementById('research-list');
        if (!items.length) {
          list.innerHTML = '<li class="empty">Nothing yet.</li>';
          return;
        }
        list.innerHTML = items
          .map((item) => `
            <li>
              <a href="${item.path}">${item.title}</a>
              ${item.description ? `<p>${item.description}</p>` : ''}
            </li>
          `)
          .join('');
      })
      .catch(() => {
        document.getElementById('research-list').innerHTML = '<li class="error">Couldn\'t load research.</li>';
      });
  </script>
</body>
</html>
