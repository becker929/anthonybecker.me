<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>world3 · Bevy trial</title>
<meta name="description" content="A trial of Room World's client in Bevy: a 3x3 block of real Room World rooms, drawn in the browser with WebGPU or WebGL2.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
  :root { --ink: #f2f2ee; --dim: rgba(242, 242, 238, 0.62); --chip: rgba(12, 12, 14, 0.58); --line: rgba(255, 255, 255, 0.14); --bad: #ffb4a8; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; overscroll-behavior: none; }
  body { font: 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
  #label {
    position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    user-select: none; -webkit-user-select: none; max-width: calc(100vw - 24px); box-sizing: border-box;
  }
  #label b { font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
  #backend { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #backend.bad { color: var(--bad); white-space: normal; }
  #label a { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  #label a:hover, #label a:focus-visible { background: rgba(255, 255, 255, 0.2); outline: none; }
  #label svg { width: 15px; height: 15px; }
  .shooting #label { display: none; }

  /* the game: a counter of orbs (dots that fill in), the E hint, a reset control, the use button, the say line */
  :root { --orb: #ffe6a6; --orb-glow: rgba(255, 214, 130, 0.75); }
  .hide { display: none !important; }
  #hud {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px; user-select: none; -webkit-user-select: none; pointer-events: none;
  }
  #orbs { display: flex; gap: 7px; padding: 8px 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #orbs i { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid rgba(242, 242, 238, 0.42); transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.3s; }
  #orbs i.on { background: var(--orb); border-color: var(--orb); box-shadow: 0 0 8px 1px var(--orb-glow); }
  #orbs i.pop { animation: pop 0.6s ease-out; }
  #orbs.all i { animation: shine 1.6s ease-in-out 2; }
  @keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.9); } 100% { transform: scale(1); } }
  @keyframes shine { 50% { box-shadow: 0 0 14px 4px var(--orb-glow); } }
  #key {
    min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; font: 600 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif; color: #141416; background: var(--orb);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.45), 0 0 12px 1px var(--orb-glow); animation: rise 0.18s ease-out;
  }
  @keyframes rise { from { transform: translateY(3px); opacity: 0; } }
  #reset {
    position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
    width: 34px; height: 34px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: var(--dim); background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; touch-action: manipulation; transition: color 0.2s, background 0.2s, transform 0.3s;
  }
  #reset svg { width: 16px; height: 16px; }
  #reset:hover, #reset:focus-visible { color: var(--ink); outline: none; }
  #reset.armed { color: #141416; background: var(--orb); transform: rotate(-200deg); }
  #use {
    position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    width: 72px; height: 72px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: #141416; background: var(--orb); border: 0; box-shadow: 0 0 22px 4px var(--orb-glow);
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; animation: rise 0.18s ease-out;
  }
  #use svg { width: 34px; height: 34px; }
  #use:active { transform: scale(0.92); }
  .touch #label { max-width: calc(100vw - 24px - 96px); }
  #say {
    position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 64px); transform: translateX(-50%);
    max-width: min(86vw, 520px); padding: 8px 14px; border-radius: 12px; box-sizing: border-box; text-align: center;
    font-size: 16px; line-height: 1.35; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none;
    opacity: 0; transition: opacity 0.6s ease; user-select: none; -webkit-user-select: none;
  }
  #say.show { opacity: 1; transition-duration: 0.2s; }
  .shooting #hud, .shooting #reset, .shooting #use, .shooting #say, .nogame #hud, .nogame #reset, .nogame #use, .nogame #say { display: none !important; }

  /* what the player carries: one token per item */
  #inv { display: flex; gap: 6px; padding: 5px 8px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #inv:empty { display: none; }
  #inv span { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: var(--orb); filter: drop-shadow(0 0 5px var(--orb-glow)); animation: pop 0.6s ease-out; }
  #inv svg { width: 20px; height: 20px; }

  /* the save: a person icon (sign in; signed in it lights), its panel, and a "Saved" mark after each write */
  #acct { position: fixed; right: calc(max(12px, env(safe-area-inset-right)) + 42px); top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #me {
    position: relative; width: 34px; height: 34px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: var(--dim); background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; touch-action: manipulation;
  }
  #me svg { width: 17px; height: 17px; }
  #me:hover, #me:focus-visible { color: var(--ink); outline: none; }
  #me.in { color: #141416; background: var(--orb); border-color: var(--orb); }
  #me.warn::after { content: ""; position: absolute; right: 1px; top: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px #0b0b0d; }
  #saved {
    position: absolute; top: 40px; right: 0; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 6px; border-radius: 999px;
    font-size: 12px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); pointer-events: none; white-space: nowrap;
    opacity: 0; transition: opacity 0.6s ease;
  }
  #saved.show { opacity: 1; transition-duration: 0.15s; }
  #saved svg { width: 12px; height: 12px; color: var(--orb); }
  #mepanel {
    width: min(260px, calc(100vw - 112px)); padding: 10px; border-radius: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
    background: rgba(12, 12, 14, 0.86); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #mewho { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #meform { display: flex; gap: 6px; }
  #mehandle { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); font: 16px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #mego { padding: 7px 10px; border-radius: 8px; border: 0; background: var(--orb); color: #141416; font: 600 13px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif; cursor: pointer; white-space: nowrap; }
  #meerr { font-size: 12px; color: var(--bad); }
  #merecord { font: 10.5px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); word-break: break-all; text-decoration: none; }
  #merecord:hover { color: var(--ink); }
  .shooting #acct, .nogame #acct { display: none !important; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Room World rooms, drawn by the Bevy trial client"></canvas>
<div id="label">
  <b>world3 · Bevy trial</b>
  <span id="backend">loading</span>
  <a id="world2" href="https://world2.anthonybecker.me/" title="Room World (world2), the live world these rooms come from" aria-label="Open Room World (world2)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5H3.5v9h9v-3"/><path d="M9 3h4v4"/><path d="M13 3 7.5 8.5"/></svg>
  </a>
</div>
<div id="hud" class="hide">
  <div id="orbs" role="img" aria-label="orbs found: 0"></div>
  <div id="inv" role="img" aria-label="carrying nothing"></div>
  <span id="key" class="hide" aria-hidden="true">E</span>
</div>
<div id="acct" class="hide">
  <button id="me" type="button" title="Sign in to save" aria-label="Sign in to save">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="5.2" r="2.7"/><path d="M2.8 14a5.2 5.2 0 0 1 10.4 0"/></svg>
  </button>
  <span id="saved" class="hide" role="status"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.4 5 8.8l4.6-5.3"/></svg>Saved</span>
  <div id="mepanel" class="hide">
    <div id="mewho" class="hide"></div>
    <div id="meerr" class="hide" role="alert"></div>
    <form id="meform"><input id="mehandle" type="text" placeholder="you.bsky.social" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Bluesky handle"><button id="mego" type="submit">Sign in</button></form>
    <a id="merecord" class="hide" target="_blank" rel="noopener"></a>
  </div>
</div>
<button id="reset" class="hide" type="button" title="Start over (tap twice)" aria-label="Start the game over">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2.5V5.5h3"/></svg>
</button>
<button id="use" class="hide" type="button" aria-label="Take it">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17V8.5a2 2 0 0 1 4 0V15"/><path d="M15 14.5v-2a2 2 0 0 1 4 0V16"/><path d="M19 15a2 2 0 0 1 4 0v4.5a8 8 0 0 1-8 8h-.6a7 7 0 0 1-5.6-2.8L5.6 20.4a2 2 0 0 1 3-2.6L11 20"/><path d="M24.5 6.5l1.8-1.8M21.5 4.8V2.5M26.8 9.6h2.4"/></svg>
</button>
<div id="say" role="status" aria-live="polite"></div>
<script type="module" src="main.js"></script>
</body>
</html>
